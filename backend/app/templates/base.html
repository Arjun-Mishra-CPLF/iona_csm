<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block title %}Iona CSM{% endblock %}</title>
  <!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><![endif]-->
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    table { border-collapse: collapse !important; }

    /* Layout */
    .wrapper { width: 100%; background-color: #f4f6f9; padding: 24px 0; }
    .container { max-width: 640px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* Header */
    .header { background-color: #1a2b4a; padding: 24px 32px; }
    .header-brand { display: inline-flex; align-items: center; gap: 10px; }
    .header-logo-text { color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .header-logo-dot { color: #3b9eff; }
    .header-tagline { color: #8fa8c8; font-size: 12px; margin-top: 2px; }
    .header-divider { border: none; border-top: 1px solid #2d4066; margin: 12px 0 0; }

    /* Content */
    .content { padding: 28px 32px; }
    .content-title { font-size: 20px; font-weight: 700; color: #1a2b4a; margin: 0 0 4px; }
    .content-subtitle { font-size: 13px; color: #6b7a99; margin: 0 0 24px; }

    /* Health badge */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
    .badge-good     { background-color: #d1fae5; color: #065f46; }
    .badge-at-risk  { background-color: #fef3c7; color: #92400e; }
    .badge-critical { background-color: #fee2e2; color: #991b1b; }

    /* Score bar */
    .score-bar-bg { background-color: #e5e7eb; border-radius: 4px; height: 8px; width: 100%; }
    .score-bar-fill { height: 8px; border-radius: 4px; }
    .score-good     { background-color: #10b981; }
    .score-at-risk  { background-color: #f59e0b; }
    .score-critical { background-color: #ef4444; }

    /* Section card */
    .card { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 16px 20px; margin: 0 0 16px; }
    .card-title { font-size: 13px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 10px; }
    .card-text { font-size: 14px; color: #334155; line-height: 1.65; margin: 0; }

    /* Change items */
    .change-item { padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .change-item:last-child { border-bottom: none; padding-bottom: 0; }
    .change-label { font-size: 13px; font-weight: 600; color: #1e293b; }
    .change-desc { font-size: 13px; color: #475569; margin-top: 2px; }
    .change-pill { display: inline-block; padding: 1px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-left: 6px; vertical-align: middle; }
    .pill-red    { background-color: #fee2e2; color: #991b1b; }
    .pill-amber  { background-color: #fef3c7; color: #92400e; }
    .pill-green  { background-color: #d1fae5; color: #065f46; }
    .pill-blue   { background-color: #dbeafe; color: #1e40af; }
    .pill-purple { background-color: #ede9fe; color: #5b21b6; }

    /* KPI row */
    .kpi-row { display: table; width: 100%; margin: 12px 0; }
    .kpi-cell { display: table-cell; text-align: center; padding: 0 8px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: #1a2b4a; }
    .kpi-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.4px; }

    /* Footer */
    .footer { background-color: #f8fafc; border-top: 1px solid #e2e8f0; padding: 20px 32px; }
    .footer-text { font-size: 11px; color: #94a3b8; line-height: 1.6; margin: 0; }
    .footer-link { color: #3b9eff; text-decoration: none; }

    /* Divider */
    .section-divider { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }

    /* Responsive */
    @media only screen and (max-width: 640px) {
      .container { border-radius: 0; }
      .content, .header, .footer { padding-left: 20px; padding-right: 20px; }
      .kpi-value { font-size: 18px; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
      <td align="center">
        <table class="container" width="640" cellpadding="0" cellspacing="0" role="presentation">

          <!-- HEADER -->
          <tr>
            <td class="header">
              <div class="header-brand">
                <span class="header-logo-text">Iona<span class="header-logo-dot">.</span>CSM</span>
              </div>
              <div class="header-tagline">Customer Success Management · IFS</div>
              <hr class="header-divider" />
            </td>
          </tr>

          <!-- BODY -->
          <tr>
            <td class="content">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td class="footer">
              <p class="footer-text">
                This is an automated notification from Iona CSM.<br />
                Sent from <a class="footer-link" href="mailto:do-not-reply-iona@ifs.com">do-not-reply-iona@ifs.com</a> — please do not reply to this message.<br />
                To update your notification preferences, log in to the Iona CSM dashboard.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</div>
</body>
</html>
