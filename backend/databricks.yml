bundle:
  name: iona_cx_bundle

resources:
  apps:
    iona_cx:
      name: iona-cx
      source_code_path: .
      description: IONA CX - Customer Success Dashboard
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: e0f7c35bbfc5d9cd
            permission: CAN_USE
        # Added to the app outside the bundle; declared here so `bundle deploy`
        # doesn't strip it and break email notifications.
        - name: sendgrid-api-key
          secret:
            scope: iona
            key: SENDGRID_API_KEY
            permission: READ

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://dbc-97a2feb3-3e52.cloud.databricks.com
      root_path: /Workspace/Users/arjun.mishra@ifs.com/.bundle/${bundle.name}/${bundle.target}
